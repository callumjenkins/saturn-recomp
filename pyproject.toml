[project]
name = "saturnrecomp"
version = "0.1.0"
description = "Static recompilation of Sega Saturn games to native PC: SH-2 to C++, and a runtime for the Saturn's hardware"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saturnrecomp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
