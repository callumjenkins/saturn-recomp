name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - run: uv sync
      - run: tools/check.sh
